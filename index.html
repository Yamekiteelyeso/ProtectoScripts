[`• No vas a hostear malware, stealers, loggers de cuentas ni nada que robe datos de otras personas.`,`• You will not host malware, stealers, account loggers or anything that steals other people's data.`,`• Você não vai hospedar malware, stealers, loggers de contas nem nada que roube dados de outras pessoas.`,`• Vous n'hébergerez pas de malware, stealers, loggers de comptes ni rien qui vole les données d'autrui.`,`• Du hostest keine Malware, Stealer, Account-Logger oder Ähnliches, das Daten anderer stiehlt.`,`• Non ospiterai malware, stealer, logger di account né nulla che rubi dati altrui.`,`• Вы не будете размещать вредоносное ПО, стилеры, логгеры аккаунтов и всё, что крадёт данные других людей.`,`• Kötü amaçlı yazılım, stealer, hesap logger'ı veya başkalarının verilerini çalan hiçbir şey barındırmayacaksın.`,`• Kamu tidak akan menghosting malware, stealer, logger akun, atau apa pun yang mencuri data orang lain.`],
[`• Solo subís código tuyo o que tenés permiso de distribuir.`,`• You only upload code that is yours or that you may distribute.`,`• Você só envia código seu ou que tem permissão para distribuir.`,`• Vous ne mettez en ligne que du code qui vous appartient ou que vous avez le droit de distribuer.`,`• Du lädst nur Code hoch, der dir gehört oder den du verteilen darfst.`,`• Carichi solo codice tuo o che hai il permesso di distribuire.`,`• Вы загружаете только свой код или тот, который вправе распространять.`,`• Yalnızca sana ait veya dağıtma iznin olan kodu yüklersin.`,`• Kamu hanya mengunggah kode milikmu atau yang boleh kamu distribusikan.`],
[`• No vas a intentar saltarte los límites ni atacar la plataforma.`,`• You will not try to bypass the limits or attack the platform.`,`• Você não vai tentar burlar os limites nem atacar a plataforma.`,`• Vous n'essaierez pas de contourner les limites ni d'attaquer la plateforme.`,`• Du versuchst nicht, Limits zu umgehen oder die Plattform anzugreifen.`,`• Non cercherai di aggirare i limiti né di attaccare la piattaforma.`,`• Вы не будете пытаться обойти лимиты или атаковать платформу.`,`• Sınırları aşmaya veya platforma saldırmaya çalışmayacaksın.`,`• Kamu tidak akan mencoba melewati batas atau menyerang platform.`],

[`En “Mis scripts” tocá “Subir script”, pegá tu código o cargá el archivo .lua y elegí un nombre para el link.`,`In “My scripts” tap “Upload script”, paste your code or load the .lua file and choose a name for the link.`,`Em “Meus scripts” toque em “Enviar script”, cole seu código ou carregue o arquivo .lua e escolha um nome para o link.`,`Dans « Mes scripts », touchez « Envoyer un script », collez votre code ou chargez le fichier .lua et choisissez un nom pour le lien.`,`Tippe unter „Meine Skripte“ auf „Skript hochladen“, füge deinen Code ein oder lade die .lua-Datei und wähle einen Namen für den Link.`,`In “I miei script” tocca “Carica script”, incolla il codice o carica il file .lua e scegli un nome per il link.`,`В «Мои скрипты» нажмите «Загрузить скрипт», вставьте код или загрузите файл .lua и выберите имя ссылки.`,`“Scriptlerim” bölümünde “Script yükle”ye dokun, kodunu yapıştır veya .lua dosyasını yükle ve bağlantı için bir ad seç.`,`Di “Skrip saya” ketuk “Unggah skrip”, tempel kodemu atau muat file .lua, lalu pilih nama untuk tautan.`],

[`Cada script tiene el suyo, con el botón Copiar. Se ve así:`,`Each script has its own, with the Copy button. It looks like this:`,`Cada script tem o seu, com o botão Copiar. Fica assim:`,`Chaque script a le sien, avec le bouton Copier. Il ressemble à ceci :`,`Jedes Skript hat seinen eigenen, mit der Schaltfläche Kopieren. So sieht er aus:`,`Ogni script ha il suo, con il pulsante Copia. Si presenta così:`,`У каждого скрипта свой, с кнопкой «Копировать». Выглядит так:`,`Her scriptin kendine ait olanı var, Kopyala düğmesiyle. Şöyle görünür:`,`Setiap skrip punya sendiri, dengan tombol Salin. Tampilannya seperti ini:`],
[`Ejecutalo con Delta`,`Run it with Delta`,`Execute com o Delta`,`Exécutez-le avec Delta`,`Führe es mit Delta aus`,`Eseguilo con Delta`,`Запустите в Delta`,`Delta ile çalıştır`,`Jalankan dengan Delta`],
[`Pegalo en tu executor y listo. Si alguien abre el link en un navegador solo ve la página de tu script con el loadstring; el código nunca se muestra. Con Discord u otras herramientas no entrega nada.`,`Paste it in your executor and you're done. If someone opens the link in a browser they only see your script's page with the loadstring; the code is never shown. With Discord or other tools it delivers nothing.`,`Cole no seu executor e pronto. Se alguém abrir o link num navegador, só verá a página do seu script com o loadstring; o código nunca é mostrado. Com Discord ou outras ferramentas, nada é entregue.`,`Collez-le dans votre executor et c'est prêt. Si quelqu'un ouvre le lien dans un navigateur, il ne voit que la page de votre script avec le loadstring ; le code n'est jamais affiché. Avec Discord ou d'autres outils, rien n'est livré.`,`Füge es in deinen Executor ein, fertig. Öffnet jemand den Link im Browser, sieht er nur die Seite deines Skripts mit dem Loadstring; der Code wird nie angezeigt. Mit Discord oder anderen Tools wird nichts ausgeliefert.`,`Incollalo nel tuo executor e basta. Se qualcuno apre il link in un browser vede solo la pagina del tuo script con il loadstring; il codice non viene mai mostrato. Con Discord o altri strumenti non viene consegnato nulla.`,`Вставьте в экзекьютор — и готово. Если кто-то откроет ссылку в браузере, он увидит только страницу скрипта с loadstring; код не показывается никогда. Через Discord и другие инструменты ничего не выдаётся.`,`Executor'ına yapıştır, bitti. Biri bağlantıyı tarayıcıda açarsa yalnızca scriptinin loadstring'li sayfasını görür; kod asla gösterilmez. Discord veya diğer araçlarla hiçbir şey teslim edilmez.`,`Tempel di executor-mu dan selesai. Jika seseorang membuka tautan di browser, mereka hanya melihat halaman skripmu dengan loadstring; kodenya tidak pernah ditampilkan. Dengan Discord atau alat lain, tidak ada yang dikirim.`],

[`Los scripts públicos los ejecuta cualquiera desde su executor, sin claves. Si querés controlarlo, hacelo privado.`,`Anyone can run public scripts from their executor, no keys needed. If you want control, make it private.`,`Qualquer pessoa executa scripts públicos no seu executor, sem keys. Se quiser controlar, torne-o privado.`,`Les scripts publics peuvent être exécutés par n'importe qui depuis son executor, sans clé. Pour contrôler l'accès, rendez-le privé.`,`Öffentliche Skripte kann jeder in seinem Executor ausführen, ohne Keys. Willst du Kontrolle, mache es privat.`,`Gli script pubblici li esegue chiunque dal proprio executor, senza key. Per avere controllo, rendilo privato.`,`Публичные скрипты может запускать любой из своего экзекьютора, без ключей. Хотите контроль — сделайте приватным.`,`Herkese açık scriptleri herkes executor'ından key olmadan çalıştırabilir. Kontrol istiyorsan özel yap.`,`Skrip publik bisa dijalankan siapa saja dari executor-nya, tanpa key. Jika ingin kontrol, jadikan privat.`],

[`Viaja cifrado con una clave distinta en cada ejecución.`,`It travels encrypted with a different key on every execution.`,`Viaja criptografado com uma chave diferente a cada execução.`,`Il voyage chiffré avec une clé différente à chaque exécution.`,`Es wird mit einem anderen Schlüssel bei jeder Ausführung verschlüsselt übertragen.`,`Viaggia cifrato con una chiave diversa a ogni esecuzione.`,`Передаётся в зашифрованном виде с новым ключом при каждом запуске.`,`Her çalıştırmada farklı bir anahtarla şifreli olarak iletilir.`,`Dikirim terenkripsi dengan kunci berbeda di setiap eksekusi.`],
[`Bloqueo de intrusos`,`Intruder blocking`,`Bloqueio de intrusos`,`Blocage des intrus`,`Eindringlinge blockieren`,`Blocco intrusi`,`Блокировка нарушителей`,`Saldırgan engelleme`,`Pemblokiran penyusup`],
[`Los bots que insisten quedan bloqueados un tiempo, de 15 minutos hasta 24 h. Los executors nunca se bloquean.`,`Bots that keep trying get blocked for a while, from 15 minutes up to 24 h. Executors are never blocked.`,`Bots que insistem ficam bloqueados por um tempo, de 15 minutos até 24 h. Executors nunca são bloqueados.`,`Les bots insistants sont bloqués un certain temps, de 15 minutes jusqu'à 24 h. Les executors ne sont jamais bloqués.`,`Bots, die es weiter versuchen, werden eine Weile gesperrt, von 15 Minuten bis 24 Std. Executors werden nie blockiert.`,`I bot insistenti vengono bloccati per un po', da 15 minuti fino a 24 h. Gli executor non vengono mai bloccati.`,`Настойчивые боты блокируются на время — от 15 минут до 24 ч. Экзекьюторы никогда не блокируются.`,`Israr eden botlar 15 dakikadan 24 saate kadar bir süre engellenir. Executor'lar asla engellenmez.`,`Bot yang terus mencoba diblokir untuk sementara, dari 15 menit hingga 24 jam. Executor tidak pernah diblokir.`],

[`Se ejecutan solo con tu key (script_key). Hasta 10 keys por script: cada una la reclama el primero que la usa y desde ahí solo corre él, las veces que quiera. Podés editarlas, borrarlas, desactivarlas y cambiar su IP cuando quieras.`,`They only run with your key (script_key). Up to 10 keys per script: each one is claimed by the first person who uses it, and from then on only they can run it, as many times as they like. You can edit, delete, disable them and change their IP whenever you want.`,`Só rodam com a sua key (script_key). Até 10 keys por script: cada uma é reivindicada por quem a usar primeiro e, a partir daí, só essa pessoa executa, quantas vezes quiser. Você pode editar, apagar, desativar e alterar o IP quando quiser.`,`Ils ne s'exécutent qu'avec votre clé (script_key). Jusqu'à 10 clés par script : chacune est réservée par le premier qui l'utilise, et seul lui peut ensuite l'exécuter, autant de fois qu'il veut. Vous pouvez les modifier, supprimer, désactiver et changer leur IP à tout moment.`,`Sie laufen nur mit deinem Key (script_key). Bis zu 10 Keys pro Skript: Jeder wird vom Ersten beansprucht, der ihn nutzt, und nur dieser kann ihn danach beliebig oft ausführen. Du kannst sie jederzeit bearbeiten, löschen, deaktivieren und ihre IP ändern.`,`Si eseguono solo con la tua key (script_key). Fino a 10 key per script: ognuna è riservata al primo che la usa e da quel momento solo lui può eseguirla, quante volte vuole. Puoi modificarle, eliminarle, disattivarle e cambiare il loro IP quando vuoi.`,`Запускаются только с вашим ключом (script_key). До 10 ключей на скрипт: каждый закрепляется за первым, кто его использует, и дальше запускать может только он — сколько угодно раз. Ключи можно менять, удалять, отключать и менять их IP в любой момент.`,`Yalnızca key'inle (script_key) çalışırlar. Script başına 10 key'e kadar: her biri onu ilk kullanana bağlanır ve bundan sonra yalnızca o kişi istediği kadar çalıştırabilir. Key'leri istediğin zaman düzenleyebilir, sileb   const st = await api(`/api/scripts/${s.id}/stats`), d = $('#dlg');
  d.innerHTML = `<h3>${esc(s.slug)}</h3><div class="stats" style="grid-template-columns:repeat(4,1fr);gap:.6rem"><div class="card stat" style="grid-column:span 2"><span>Ejecuciones totales</span><b style="font-size:2.4rem">${fmt(st.total)}</b></div><div class="card stat"><span>Hoy</span><b>${fmt(st.today)}</b></div><div class="card stat"><span>Esta semana</span><b>${fmt(st.week)}</b></div></div>
  <p style="color:var(--mu);margin:1rem 0 .5rem">Por semana · ${fmt(st.blocked)} accesos bloqueados en total</p>${plot(st)}${st.recent && st.recent.length ? `<p style="color:var(--mu);margin:1.2rem 0 .4rem">Últimas ejecuciones (UserId de Roblox)</p><div style="display:grid;gap:.4rem;font:13px var(--mono)">${st.recent.map((r) => `<div style="display:flex;gap:.6rem;align-items:center"><a class="dcl" target="_blank" rel="noopener" href="https://www.roblox.com/users/${esc(r.rbx_id)}/profile">${esc(r.rbx_id)}</a><span style="color:var(--mu)">· ${ago(r.ts)}</span><span style="flex:1"></span><button class="btn sm dng" data-a="ban" data-id="${s.id}" data-u="${esc(r.rbx_id)}">Bloquear</button></div>`).join('')}</div>` : ''}${st.bans && st.bans.length ? `<p style="color:var(--mu);margin:1.2rem 0 .4rem">Usuarios bloqueados</p><div style="display:grid;gap:.4rem;font:13px var(--mono)">${st.bans.map((r) => `<div style="display:flex;gap:.6rem;align-items:center"><span>${esc(r.rbx_id)}</span><span style="flex:1"></span><button class="btn sm" data-a="unban" data-id="${s.id}" data-u="${esc(r.rbx_id)}">Quitar</button></div>`).join('')}</div>` : ''}<div class="da"><button class="btn" id="x">Cerrar</button></div>`;
  if (!d.open) d.showModal(); $('#x').onclick = () => d.close();
}

function keyEditor(s, k) {
  const d = $('#dlg');
  d.innerHTML = `<div class="edt"><h3>Editar key</h3><label for="kl">Nombre / nota</label><input id="kl" maxlength="30" value="${esc(k.label || '')}" placeholder="ej. Amigo Juan"><label for="kk">Key</label><div style="display:flex;gap:.5rem"><input id="kk" value="${esc(k.k)}" spellcheck="false" autocomplete="off"><button type="button" class="btn sm" id="kg">Generar</button></div><div class="url">6-40 caracteres: letras, números, _ o -</div>
  <label class="chk" style="margin:1rem 0 .2rem"><input type="checkbox" id="ke" ${k.enabled ? 'checked' : ''}><span>Key activa</span></label>
  <label class="chk"><input type="checkbox" id="kx" ${k.lax ? 'checked' : ''}><span>Si cambia la IP, que la key siga a la misma cuenta de Roblox que la reclamó</span></label>
  <div class="msg" id="e2" role="alert"></div><div class="da"><button class="btn" id="x">Cancelar</button><button class="btn pri" id="ok">Guardar</button></div></div>`;
  d.showModal(); $('#x').onclick = () => d.close();
  $('#kg').onclick = () => { $('#kk').value = Array.from(crypto.getRandomValues(new Uint8Array(16)), (n) => 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'[n % 56]).join(''); };
  $('#ok').onclick = async () => { const b = $('#ok'); b.disabled = true; try { await api(`/api/scripts/${s.id}/keys/${k.id}`, { method: 'PATCH', body: { label: $('#kl').value, key: $('#kk').value.trim(), enabled: $('#ke').checked, lax: $('#kx').checked } }); d.close(); toast('Key guardada'); await load(); paint(); } catch (e) { $('#e2').textContent = e.message; b.disabled = false; } };
}
function ipEditor(s, k) {
  const d = $('#dlg');
  d.innerHTML = `<div class="edt"><h3>Cambiar IP de la key</h3><p style="color:var(--mu)"><span>${k.bound ? 'Esta key está vinculada a una IP.' : 'Esta key todavía no tiene IP: la reclama el primero que la use.'}</span> <span>Escribí la IP que querés permitir, o dejá vacío para liberarla (la reclama la próxima IP que la use).</span></p><label for="ki">Nueva IP</label><input id="ki" placeholder="ej. 190.12.34.56" autocomplete="off" spellcheck="false" inputmode="decimal"><div class="msg" id="e2" role="alert"></div><div class="da"><button class="btn" id="x">Cancelar</button><button class="btn pri" id="ok">Guardar</button></div></div>`;
  d.showModal(); $('#x').onclick = () => d.close(); $('#ki').focus();
  $('#ok').onclick = async () => { const b = $('#ok'); b.disabled = true; try { await api(`/api/scripts/${s.id}/keys/${k.id}`, { method: 'PATCH', body: { set_ip: $('#ki').value.trim() } }); d.close(); toast($('#ki').value.trim() ? 'IP actualizada' : 'IP liberada'); await load(); paint(); } catch (e) { $('#e2').textContent = e.message; b.disabled = false; } };
}
/* ---------- Acciones ---------- */
const A = {
  nav(_, b) { view = b.dataset.v; history.replaceState(0, '', '#' + view); dash(); },
  new() { editor(); },
  out: async () => { if (!(await ask('¿Cerrar sesión?', 'Vas a salir de tu cuenta en este dispositivo. Tus scripts y estadísticas quedan guardados.', 'Cerrar sesión'))) return; try { await api('/api/logout', { method: 'POST' }); } catch {} setT(null); me = null; D = { ov: null, list: null }; mode = 'login'; authView(); },
  copy: (s) => { navigator.clipboard.writeText(s.loadstring).then(() => toast('Loadstring copiado'), () => toast('No pude copiar, seleccionalo a mano', 'err')); },
  dc: async () => toast((await copyText(INV)) ? 'Link de Discord copiado' : 'No pude copiar, mantené presionado el link', ''),
  priv: async (s) => { if (s.private && !(await ask('¿Hacer público el script?', 'Cualquiera podrá ejecutarlo sin key.', 'Hacer público'))) return; await api('/api/scripts/' + s.id, { method: 'PATCH', body: { private: !s.private } }); await load(); paint(); toast(s.private ? 'Ahora es público' : 'Ahora es privado: se ejecuta con tu key'); },
  ban: async (s, b) => { if (await ask('¿Bloquear este usuario?', `El UserId ${b.dataset.u} no podrá ejecutar “${s.slug}”.`, 'Bloquear', true)) { await api(`/api/scripts/${s.id}/ban`, { method: 'POST', body: { rbx_id: b.dataset.u } }); await stats(s); toast('Usuario bloqueado'); } },
  unban: async (s, b) => { await api(`/api/scripts/${s.id}/ban/${b.dataset.u}`, { method: 'DELETE' }); await stats(s); toast('Usuario desbloqueado'); },
  knew: async (s) => { await api(`/api/scripts/${s.id}/keys`, { method: 'POST', body: {} }); await load(); paint(); toast('Key creada'); },
  kcopy: async (s, b) => { const k = s.keys.find((x) => x.id == b.dataset.k); toast((await copyText(`script_key="${k.k}"; loadstring(game:HttpGet("${s.url}"))()`)) ? 'Loadstring con key copiado' : 'No pude copiar', ''); },
  kedit: (s, b) => keyEditor(s, s.keys.find((x) => x.id == b.dataset.k)),
  kip: (s, b) => ipEditor(s, s.keys.find((x) => x.id == b.dataset.k)),
  kdel: async (s, b) => { const k = s.keys.find((x) => x.id == b.dataset.k); if (await ask(`¿Borrar la key “${k.label || k.k}”?`, 'Quien la use dejará de poder ejecutar el script. No se puede deshacer.', 'Borrar key', true)) { await api(`/api/scripts/${s.id}/keys/${k.id}`, { method: 'DELETE' }); await load(); paint(); toast('Key borrada'); } },
  stats, edit: editor,
  tog: async (s) => { await api('/api/scripts/' + s.id, { method: 'PATCH', body: { enabled: !s.enabled } }); await load(); paint(); toast(s.enabled ? 'Script pausado' : 'Script activado'); },
  del: async (s) => { if (await ask(`⚠ ¿Borrar “${s.slug}”?`, `Se elimina el script y sus ${fmt(s.total)} ejecuciones registradas. Su loadstring dejará de funcionar para todos y NO se puede deshacer.`, 'Sí, borrar', true)) { await api('/api/scripts/' + s.id, { method: 'DELETE' }); await load(); paint(); toast('Script borrado'); } },
};
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-a]'); if (!b || !A[b.dataset.a]) return;
  if (b.dataset.a === 'dc') e.preventDefault();
  const s = D.list?.find((x) => x.id == b.dataset.id);
  try { await A[b.dataset.a](s, b); } catch (er) { toast(er.message, 'err'); }
});
document.addEventListener('click', (e) => { if (e.target.tagName === 'DIALOG' && e.target.id === 'dlg') e.target.close(); });

async function boot() { try { prov = await api('/api/providers'); INV = prov.invite || ''; } catch {} try { me = await api('/api/me'); dash(); } catch { me = null; authView(); } }
boot();
</script>
</body>
</html>
